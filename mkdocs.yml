site_name: GPMQ
site_description: >-
  GPMQ (General Purpose Message Queue) — a lightweight Python distributed message
  queue built on Redis Streams, designed for personal projects and MVPs.
site_url: https://linnetcodes.github.io/gpmq
repo_url: https://github.com/LinnetCodes/gpmq
repo_name: LinnetCodes/gpmq
edit_uri: edit/mkdocs-pre-publish/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav:
            - Home: index.zh.md
            - API 参考: api/gpmq_api.zh.md
            - CLI 参考: cli/gpmq_cli.zh.md

nav:
  - Home: index.md
  - API Reference: api/gpmq_api.md
  - CLI Reference: cli/gpmq_cli.md
