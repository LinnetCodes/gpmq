# gpmq/common.yaml - GPMQ 公共配置
# 包含 Redis 连接、消息流、注册中心等共享设置
# Publisher 和 Subscriber 默认继承这些配置项

cfg_class_name: "GPMQConfig"

# --- Redis 连接 ---
redis_host: "127.0.0.1"
redis_port: 6379
redis_db: 0
redis_password: "123456"
redis_max_retries: 3
redis_retry_delay: 1.0
redis_socket_timeout: 10.0  # 必须大于 worker 读取阻塞时长（worker_read_block_ms，默认 1000ms）

# --- 消息流 ---
stream_name: "gpmq:messages"

# --- 注册中心 ---
# 15s 间隔 → 45s 失活判定阈值（heartbeat_interval * 3），给粘性路由下
# ~30s 的慢任务留足余量（worker 心跳按节流窗口刷新，非严格 15s 一次）
heartbeat_interval: 15
registry_key_prefix: "gpmq"

# --- 审计与日志 ---
audit_db_path: "/var/tmp/gpmq/db/gpmq_audit.db"
log_category: "gpmq"
