# gpmq/common.yaml - GPMQ 公共配置
# 包含 Redis 连接、消息流、注册中心等共享设置
# Publisher 和 Subscriber 默认继承这些配置项

cfg_class_name: "GPMQConfig"

# --- Redis 连接 ---
redis_host: "127.0.0.1"
redis_port: 6379
redis_db: 0
redis_password: "123456"
redis_max_retries: 3
redis_retry_delay: 1.0

# --- 消息流 ---
stream_name: "gpmq:messages"

# --- 注册中心 ---
enable_registry: true
heartbeat_interval: 10
registry_key_prefix: "gpmq"
subscriber_timeout: 60.0

# --- 审计与日志 ---
audit_db_path: "/var/tmp/gpmq/db/gpmq_audit.db"
log_category: "gpmq"
