[project]
name = "gpmq"
dynamic = ["version"]
description = "GPMQ (General Purpose Message Queue) - A lightweight Python distributed message queue built on Redis Streams, designed for personal projects and MVP (Minimum Viable Product) projects."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Linnet Codes", email = "linnet.codes@gmail.com"},
]
keywords = [
    "message-queue",
    "redis",
    "redis-streams",
    "task-queue",
    "distributed",
    "pubsub",
    "worker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Object Brokering",
    "Typing :: Typed",
]
dependencies = [
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "gpconfig>=0.3.0",
    "gpclog>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/LinnetCodes/gpmq"
Documentation = "https://linnetcodes.github.io/gpmq/"
Source = "https://github.com/LinnetCodes/gpmq"
Issues = "https://github.com/LinnetCodes/gpmq/issues"
Changelog = "https://github.com/LinnetCodes/gpmq/releases"

[project.scripts]
gpmq = "gpmq.cli:cli"
gpmq-worker = "gpmq.cli:gpmq_worker"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "progressbar2>=4.5.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-static-i18n>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpmq"]

[tool.hatch.version]
# Single source of truth: read the version from the package __init__.
# Hatchling parses the file statically (no import/execution), so build-time
# dependencies are not required.
path = "src/gpmq/__init__.py"

[tool.hatch.build.targets.sdist]
# Runtime code + standard metadata + docs sources.
# Docs are shipped so users in regions where GitHub/Pages is unreliable can
# read or rebuild the documentation offline from the sdist alone. Only tests,
# examples and CI tooling are excluded as they are not useful to installers.
only-include = [
    "src/gpmq",
    "docs",
    "mkdocs.yml",
    "README.md",
    "README.zh-CN.md",
    "LICENSE",
    "pyproject.toml",
]
